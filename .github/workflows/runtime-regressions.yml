name: Runtime regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: evolution-cms/evolution
          ref: 6d3a589747097fad28a69ca1f61c34db7c24ccda # 3.6.x, Composer version 3.6.0
          path: .test-core
      - uses: actions/checkout@v4
        with:
          repository: Seiger/sTask
          ref: 6355cf293422d43885d803cdd43637c0896f63cd
          path: .test-stask
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, gd, exif, intl, zip, imagick
          coverage: none
      - name: Prepare isolated package dependencies
        run: |
          php tests/ci/prepare-runtime.php
          composer update seiger/sgallery seiger/stask --working-dir=.test-core/core --with-dependencies --minimal-changes --no-dev --no-interaction --no-scripts --prefer-dist
      - name: Select target PHP runtime
        if: matrix.php != '8.4'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, gd, exif, intl, zip, ${{ startsWith(matrix.php, '8.6') && ':imagick' || 'imagick' }}
          coverage: none
      - name: Check runtime platform requirements
        run: composer check-platform-reqs --working-dir=.test-core/core --no-dev
      - name: Run package regression scripts
        env:
          SGALLERY_AUTOLOAD: ${{ github.workspace }}/.test-core/core/vendor/autoload.php
          PACKAGE_AUTOLOAD: ${{ github.workspace }}/.test-core/core/vendor/autoload.php
        run: sh tests/ci/run-runtime.sh
      - name: Select GD without EXIF
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "gd, :exif, :imagick"
          coverage: none
      - name: Run without EXIF
        env:
          PACKAGE_AUTOLOAD: ${{ github.workspace }}/.test-core/core/vendor/autoload.php
        run: php tests/optional-exif.php
