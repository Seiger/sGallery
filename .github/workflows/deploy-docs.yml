name: Rebuild branch documentation

on:
  push:
    branches: ['[0-9]+.x']
    paths:
      - 'docs/**'
      - '!docs/audit/**'
      - '!docs/testing/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  documentation:
    uses: Seiger/sGallery/.github/workflows/deploy-docs.yml@docs
